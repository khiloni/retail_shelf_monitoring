[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shelf-monitor"
version = "0.1.0"
description = "Retail Shelf Monitoring System — end-to-end deep-learning pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DL-PROJECT"}]

dependencies = [
    # Core ML
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.0.200",
    "onnxruntime>=1.16.0",
    "faiss-cpu>=1.7.4",
    # Vision
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    # Data / config
    "pydantic>=2.4.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    # DB / persistence
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    # DI
    "dependency-injector>=4.41.0",
    # Async helpers
    "anyio>=4.0.0",
    # Progress / logging
    "tqdm>=4.66.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
ui = [
    "PySide6>=6.6.0",
]
openvino = [
    "openvino>=2023.1.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]
redis = [
    "redis>=5.0.0",
]
dev = [
    "PySide6>=6.6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "nbformat>=5.9.0",
]
train = [
    "roboflow>=1.1.0",
]

[project.scripts]
shelf-monitor = "shelf_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shelf_monitor*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
